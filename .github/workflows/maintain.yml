name: Maintain code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Update baseline snapshots
        type: boolean
        default: false

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tsc

  lint-check:
    name: Lint check
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eslint

  unit-test:
    name: Unit test
    needs: lint-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run jest

  snapshot-test-linux-chromium:
    name: Snapshot test (Linux Chromium)
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx expo export -p web
      - run: npx playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
      - if: ${{ inputs.update_snapshots }}
        name: Commit updated web visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --staged --quiet; then
            echo "No baseline changes to commit"
          else
            git commit -m "Update web visual regression baselines"
            git pull --rebase origin main
            git push
          fi

  snapshot-test-android-pixel-7:
    name: Snapshot test (Android Pixel 7)
    needs: snapshot-test-linux-chromium
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator's PulseAudio dependency
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Pixel_7_API_34
          script: npx expo prebuild --platform android && npx detox build -c android && npx detox test -c android ${{ inputs.update_snapshots && '-- -u' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-android-artifacts
          path: artifacts
      - if: ${{ inputs.update_snapshots }}
        name: Commit updated Android visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --staged --quiet; then
            echo "No baseline changes to commit"
          else
            git commit -m "Update Android visual regression baselines"
            git pull --rebase origin main
            git push
          fi

  snapshot-test-ios-iphone-17:
    name: Snapshot test (iOS iPhone 17)
    needs: snapshot-test-android-pixel-7
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils
      - run: npx expo prebuild --platform ios && npx detox build -c ios && npx detox test -c ios ${{ inputs.update_snapshots && '-- -u' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-ios-artifacts
          path: artifacts
      - if: ${{ inputs.update_snapshots }}
        name: Commit updated iOS visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --staged --quiet; then
            echo "No baseline changes to commit"
          else
            git commit -m "Update iOS visual regression baselines"
            git pull --rebase origin main
            git push
          fi
