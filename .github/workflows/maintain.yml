name: Maintain code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate and commit the web, Android, and iOS visual regression baselines
        type: boolean
        default: false

jobs:
  # type-check/lint-check/unit-test/snapshot-test-web/snapshot-test-android are temporarily
  # disabled (if: false) while debugging snapshot-test-ios, to iterate faster. Re-enable by
  # removing the `if: false` lines and restoring snapshot-test-ios's `needs: snapshot-test-android`.
  type-check:
    name: Type check
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tsc

  lint-check:
    name: Lint check
    if: false
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eslint

  unit-test:
    name: Unit test
    if: false
    needs: lint-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run jest

  snapshot-test-web:
    name: Snapshot test (Linux Chrome)
    if: false
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ inputs.update_snapshots && 'test:visual:web:update' || 'test:visual:web' }}
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
      - if: ${{ inputs.update_snapshots }}
        name: Commit updated web visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visual/view.visual.spec.ts-snapshots
          if git diff --staged --quiet; then
            echo "No baseline changes to commit"
          else
            git commit -m "Update web visual regression baselines"
            git pull --rebase origin main
            git push
          fi

  snapshot-test-android:
    name: Snapshot test (Android Pixel 7)
    if: false
    needs: snapshot-test-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator's PulseAudio dependency
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Pixel_7_API_34
          script: npm run ${{ inputs.update_snapshots && 'test:visual:android:update' || 'test:visual:android' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-android-artifacts
          path: example/artifacts
      - if: ${{ inputs.update_snapshots }}
        name: Commit updated Android visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add example/e2e/__image_snapshots__
          if git diff --staged --quiet; then
            echo "No baseline changes to commit"
          else
            git commit -m "Update Android visual regression baselines"
            git pull --rebase origin main
            git push
          fi

  snapshot-test-ios:
    name: Snapshot test (iOS iPhone 15)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils
      - run: npm run ${{ inputs.update_snapshots && 'test:visual:ios:update' || 'test:visual:ios' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-ios-artifacts
          path: example/artifacts
      - if: ${{ inputs.update_snapshots }}
        name: Commit updated iOS visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add example/e2e/__image_snapshots__
          if git diff --staged --quiet; then
            echo "No baseline changes to commit"
          else
            git commit -m "Update iOS visual regression baselines"
            git pull --rebase origin main
            git push
          fi
