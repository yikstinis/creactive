name: Visual regression (native)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visual-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:visual:ios
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-ios-artifacts
          path: example/artifacts

  visual-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator's PulseAudio dependency
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Pixel_7_API_34
          script: npm run test:visual:android
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-android-artifacts
          path: example/artifacts
