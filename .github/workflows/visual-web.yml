name: Visual regression (web)

on:
  workflow_dispatch:
  # Disabled from automatic push/pull_request triggers while the native pipeline is being
  # stabilized, to keep CI noise down. The web run itself was never confirmed passing in
  # actual CI (only locally) — re-enable once that's checked. Trigger manually via
  # Actions -> "Visual regression (web)" -> Run workflow in the meantime.

jobs:
  visual-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:web
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
